<section class="featured-section">
  <h2>Featured Recipes</h2>
  
  <div class="carousel-container">
    <button class="carousel-btn prev-btn" id="prevBtn" aria-label="Previous Recipes">&#10094;</button>
    
    <div class="carousel-track-wrapper">
      <div class="carousel-track" id="carouselTrack">
        {% assign sample_recipes = site.recipes | sample: 10 %}
        {% for recipe in sample_recipes %}
          <a href="{{ recipe.url | relative_url }}" class="carousel-card">
            {% if recipe.image %}
              <img src="{{ recipe.image | relative_url }}" alt="{{ recipe.title }}" class="carousel-card-img">
            {% else %}
              <div class="carousel-card-placeholder"></div>
            {% endif %}
            <div class="carousel-card-content">
              <h3>{{ recipe.title }}</h3>
              <p>{{ recipe.description }}</p>
            </div>
          </a>
        {% endfor %}
      </div>
    </div>

    <button class="carousel-btn next-btn" id="nextBtn" aria-label="Next Recipes">&#10095;</button>
  </div>
</section>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const track = document.getElementById('carouselTrack');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    
    if (!track || !prevBtn || !nextBtn) return;

    // Shuffle the 10 loaded cards on page visit
    const cards = Array.from(track.children);
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      track.appendChild(cards[j]);
    }

    let currentIndex = 0;
    
    function updateCarousel() {
      const currentCards = track.querySelectorAll('.carousel-card');
      if (currentCards.length === 0) return;
      const cardWidth = currentCards[0].offsetWidth + 20;
      track.style.transform = `translateX(-${currentIndex * cardWidth}px)`;
    }

    nextBtn.addEventListener('click', () => {
      const totalCards = track.querySelectorAll('.carousel-card').length;
      const visibleCards = window.innerWidth <= 768 ? 1 : 3;
      if (currentIndex < totalCards - visibleCards) {
        currentIndex++;
      } else {
        currentIndex = 0;
      }
      updateCarousel();
    });

    prevBtn.addEventListener('click', () => {
      const totalCards = track.querySelectorAll('.carousel-card').length;
      const visibleCards = window.innerWidth <= 768 ? 1 : 3;
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = Math.max(0, totalCards - visibleCards);
      }
      updateCarousel();
    });

    setInterval(() => {
      nextBtn.click();
    }, 5000);
  });
</script>
