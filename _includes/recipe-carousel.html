<section class="featured-section">
  <h2>Featured Recipes</h2>
  
  <div class="carousel-container">
    <button class="carousel-btn prev-btn" id="prevBtn" aria-label="Previous Recipes">&#10094;</button>
    
    <div class="carousel-track-wrapper">
      <div class="carousel-track" id="carouselTrack">
        {% assign sample_recipes = site.recipes | sample: 10 %}
        {% for recipe in sample_recipes %}
          <a href="{{ recipe.url | relative_url }}" class="carousel-card">
            {% if recipe.image %}
              <img src="{{ recipe.image | relative_url }}" alt="{{ recipe.title }}" class="carousel-card-img">
            {% else %}
              <div class="carousel-card-placeholder"></div>
            {% endif %}
            <div class="carousel-card-content">
              <h3>{{ recipe.title }}</h3>
              <p>{{ recipe.description }}</p>
            </div>
          </a>
        {% endfor %}
      </div>
    </div>

    <button class="carousel-btn next-btn" id="nextBtn" aria-label="Next Recipes">&#10095;</button>
  </div>
</section>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const track = document.getElementById('carouselTrack');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    
    if (!track || !prevBtn || !nextBtn) return;

    // 1. Shuffle cards on page load
    const initialCards = Array.from(track.children);
    for (let i = initialCards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      track.appendChild(initialCards[j]);
    }

    let isTransitioning = false;

    // 2. Next Button Action (Infinite Forward Scroll)
    function slideNext() {
      if (isTransitioning) return;
      const cards = track.querySelectorAll('.carousel-card');
      if (cards.length === 0) return;

      isTransitioning = true;
      const cardWidth = cards[0].offsetWidth + 20; // Card width + gap

      // Smooth slide forward by 1 card
      track.style.transition = 'transform 0.4s ease-in-out';
      track.style.transform = `translateX(-${cardWidth}px)`;

      // After slide completes, move the first card to the end and reset track offset without animation
      setTimeout(() => {
        track.style.transition = 'none';
        track.appendChild(cards[0]);
        track.style.transform = 'translateX(0)';
        isTransitioning = false;
      }, 400);
    }

    // 3. Prev Button Action (Infinite Backward Scroll)
    function slidePrev() {
      if (isTransitioning) return;
      const cards = track.querySelectorAll('.carousel-card');
      if (cards.length === 0) return;

      isTransitioning = true;
      const cardWidth = cards[0].offsetWidth + 20;

      // Move the last card to the front instantly behind the scenes
      track.style.transition = 'none';
      track.insertBefore(cards[cards.length - 1], cards[0]);
      track.style.transform = `translateX(-${cardWidth}px)`;

      // Animate sliding back into view
      setTimeout(() => {
        track.style.transition = 'transform 0.4s ease-in-out';
        track.style.transform = 'translateX(0)';
      }, 20);

      setTimeout(() => {
        isTransitioning = false;
      }, 420);
    }

    nextBtn.addEventListener('click', slideNext);
    prevBtn.addEventListener('click', slidePrev);

    // Auto advancement timer
    setInterval(() => {
      slideNext();
    }, 5000);
  });
</script>
