<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Shared Crumb</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #2D3748;
      background-color: #FAF5EF;
    }
    header {
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 2px solid #E2E8F0;
    }
    h1 { color: #C53030; margin-bottom: 5px; }
    .tagline { color: #718096; font-style: italic; }
    .recipe-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 24px;
      margin-top: 30px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }
    ul { padding-left: 20px; }
  </style>
</head>
<body>

  <header>
    <h1>The Shared Crumb</h1>
    <p class="tagline">Simple recipes made to be shared.</p>
  </header>

  <main>
    <div class="recipe-card">
      <h2>Featured Recipe: Everyday Sourdough</h2>
      <p>A classic sourdough bread with a crispy crust and a tender, airy interior.</p>
      
      <h3>Ingredients</h3>
      <ul>
        <li>500g Bread Flour</li>
        <li>350g Warm Water</li>
        <li>100g Active Starter</li>
        <li>10g Salt</li>
      </ul>
    </div>
  </main>

</body>
</html>
