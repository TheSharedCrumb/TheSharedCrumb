<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Dynamic Print URL Binding
    const recipeArticle = document.querySelector('.recipe-article');
    if (recipeArticle) {
      recipeArticle.setAttribute('data-print-url', window.location.pathname);
    }

    // 0. Group Ingredients & Instructions into Column Containers & Inject Jump Target
    const recipeBody = document.querySelector('.recipe-body');
    if (recipeBody) {
      const h3s = Array.from(recipeBody.querySelectorAll('h3'));
      const ingredientsH3 = h3s.find(h3 => h3.textContent.trim().toLowerCase().includes('ingredients'));
      const instructionsH3 = h3s.find(h3 => h3.textContent.trim().toLowerCase().includes('instructions'));

      if (ingredientsH3) {
        // Set anchor target for "Jump to Recipe"
        ingredientsH3.id = 'recipe-card';

        const leftCol = document.createElement('div');
        leftCol.className = 'recipe-column-left';
        recipeBody.insertBefore(leftCol, ingredientsH3);
        
        leftCol.appendChild(ingredientsH3);

        let currentElem = leftCol.nextElementSibling;
        while (currentElem && currentElem !== instructionsH3) {
          const nextElem = currentElem.nextElementSibling;
          leftCol.appendChild(currentElem);
          currentElem = nextElem;
        }
      }

      if (instructionsH3) {
        const rightCol = document.createElement('div');
        rightCol.className = 'recipe-column-right';
        recipeBody.insertBefore(rightCol, instructionsH3);
        
        let currentElem = rightCol.nextElementSibling;
        while (currentElem) {
          const nextElem = currentElem.nextElementSibling;
          rightCol.appendChild(currentElem);
          currentElem = nextElem;
        }

        // CONTINUOUS LIST NUMBERING FIX:
        // Automatically set <ol start="..."> so numbers continue across <h4> headers
        let globalStepCounter = 1;
        const olElements = rightCol.querySelectorAll('ol');
        olElements.forEach(ol => {
          ol.setAttribute('start', globalStepCounter);
          const stepCount = ol.querySelectorAll('li').length;
          globalStepCounter += stepCount;
        });
      }
    }

    // Dynamic Jump-to-Recipe Scroll Handler (Calculates exact header height at click)
    const jumpBtn = document.querySelector('.jump-btn');
    if (jumpBtn) {
      jumpBtn.addEventListener('click', (e) => {
        e.preventDefault();
        
        const target = document.getElementById('recipe-card');
        const header = document.querySelector('header');
        
        if (target && header) {
          const headerHeight = header.offsetHeight;
          const elementPosition = target.getBoundingClientRect().top + window.scrollY;
          const offsetPosition = elementPosition - headerHeight - 20;

          window.scrollTo({
            top: offsetPosition,
            behavior: 'smooth'
          });
        }
      });
    }

    // 1. Interactive Checkboxes & Dynamic "Copy Ingredients" Insertion
    const ingredientLists = document.querySelectorAll('.recipe-body ul');
    if (ingredientLists.length > 0) {
      ingredientLists.forEach(ul => {
        const items = ul.querySelectorAll('li');
        items.forEach(li => {
          const label = document.createElement('label');
          label.className = 'ingredient-checkbox-label';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'ingredient-checkbox';

          const textSpan = document.createElement('span');
          textSpan.className = 'ingredient-text';
          textSpan.innerHTML = li.innerHTML;

          label.appendChild(checkbox);
          label.appendChild(textSpan);

          li.innerHTML = '';
          li.appendChild(label);

          checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
              label.classList.add('checked');
            } else {
              label.classList.remove('checked');
            }
          });
        });

        const copyWrapper = document.createElement('div');
        copyWrapper.className = 'copy-ingredients-wrapper';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'action-btn copy-btn';
        copyBtn.innerHTML = '📋 Copy Ingredients';

        copyBtn.addEventListener('click', () => {
          const allTextSpans = ul.querySelectorAll('.ingredient-text');
          if (allTextSpans.length === 0) return;

          const textToCopy = Array.from(allTextSpans)
            .map(span => `• ${span.innerText.trim()}`)
            .join('\n');

          navigator.clipboard.writeText(textToCopy).then(() => {
            copyBtn.innerHTML = '✓ Copied!';
            copyBtn.classList.add('copied');

            setTimeout(() => {
              copyBtn.innerHTML = '📋 Copy Ingredients';
              copyBtn.classList.remove('copied');
            }, 2000);
          }).catch(err => {
            console.error('Clipboard copy failed: ', err);
          });
        });

        copyWrapper.appendChild(copyBtn);
        ul.parentNode.insertBefore(copyWrapper, ul.nextSibling);
      });
    }

    // 2. Native Mobile Web Share API
    const shareBtn = document.getElementById('shareBtn');
    if (shareBtn) {
      shareBtn.addEventListener('click', async () => {
        const shareData = {
          title: "{{ page.title | escape }}",
          text: "{{ page.description | escape }}",
          url: window.location.href
        };

        if (navigator.share) {
          try {
            await navigator.share(shareData);
          } catch (err) {
            console.log('Share sheet dismissed');
          }
        } else {
          navigator.clipboard.writeText(window.location.href).then(() => {
            shareBtn.innerHTML = '✓ Link Copied!';
            shareBtn.classList.add('copied');

            setTimeout(() => {
              shareBtn.innerHTML = '🔗 Share';
              shareBtn.classList.remove('copied');
            }, 2000);
          });
        }
      });
    }

    // 3. Click-to-Dim Instruction Steps Progress
    const instructionLists = document.querySelectorAll('.recipe-body ol');
    if (instructionLists.length > 0) {
      instructionLists.forEach(ol => {
        const steps = ol.querySelectorAll('li');
        steps.forEach(step => {
          step.addEventListener('click', () => {
            step.classList.toggle('completed-step');
          });
        });
      });
    }

    // 4. Mobile Cook Mode (Screen WakeLock API, Floating Clone & Smooth Footer Docking)
    const inlineCookBtn = document.getElementById('cookModeBtn');
    const recipeActions = document.querySelector('.recipe-actions');
    const footer = document.querySelector('footer');
    let wakeLock = null;
    let idleTimer = null;
    let isFloatingVisible = false;

    if (inlineCookBtn) {
      let floatingCookBtn = document.getElementById('floatingCookBtn');
      if (!floatingCookBtn) {
        floatingCookBtn = inlineCookBtn.cloneNode(true);
        floatingCookBtn.id = 'floatingCookBtn';
        floatingCookBtn.classList.add('floating-cook-btn');
        document.body.appendChild(floatingCookBtn);
      }

      const updateCookModeState = (isActive) => {
        const statusText = isActive ? 'ON' : 'OFF';
        [inlineCookBtn, floatingCookBtn].forEach(btn => {
          if (btn) {
            btn.classList.toggle('active', isActive);
            const statusSpan = btn.querySelector('.cook-mode-status');
            if (statusSpan) statusSpan.textContent = statusText;
          }
        });
      };

      const toggleWakeLock = async () => {
        if ('wakeLock' in navigator) {
          if (!wakeLock) {
            try {
              wakeLock = await navigator.wakeLock.request('screen');
              updateCookModeState(true);
            } catch (err) {
              console.error(`Wake Lock failed: ${err.name}, ${err.message}`);
            }
          } else {
            try {
              await wakeLock.release();
            } catch (err) {
              console.error(`Wake Lock release failed: ${err.message}`);
            }
            wakeLock = null;
            updateCookModeState(false);
          }
        } else {
          const isActive = inlineCookBtn.classList.contains('active');
          updateCookModeState(!isActive);
        }
      };

      inlineCookBtn.addEventListener('click', toggleWakeLock);
      floatingCookBtn.addEventListener('click', toggleWakeLock);

      const resetIdleTimer = () => {
        if (!isFloatingVisible) return;
        floatingCookBtn.classList.remove('idle');
        clearTimeout(idleTimer);

        idleTimer = setTimeout(() => {
          if (isFloatingVisible) {
            floatingCookBtn.classList.add('idle');
          }
        }, 3000);
      };

      const evaluateFloatingState = () => {
        const isTouchOrMobile = window.matchMedia('(hover: none) and (pointer: coarse), (max-width: 768px)').matches;
        if (!isTouchOrMobile) return;

        const scrollY = window.scrollY || window.pageYOffset;
        
        if (scrollY < 120) {
          if (isFloatingVisible) {
            isFloatingVisible = false;
            floatingCookBtn.classList.remove('visible', 'idle');
            floatingCookBtn.style.transform = 'translate3d(0, 0, 0)';
            clearTimeout(idleTimer);
          }
          return;
        }

        if (recipeActions) {
          const actionsRect = recipeActions.getBoundingClientRect();
          const isOut = actionsRect.bottom < 0;

          if (isOut) {
            if (!isFloatingVisible) {
              isFloatingVisible = true;
              floatingCookBtn.classList.add('visible');
              resetIdleTimer();
            }

            if (footer) {
              const footerRect = footer.getBoundingClientRect();
              const windowHeight = window.innerHeight;

              if (footerRect.top < windowHeight) {
                const overlap = Math.floor(windowHeight - footerRect.top + 12);
                floatingCookBtn.style.transform = `translate3d(0, -${overlap}px, 0)`;
              } else {
                floatingCookBtn.style.transform = 'translate3d(0, 0, 0)';
              }
            }
          } else if (isFloatingVisible) {
            isFloatingVisible = false;
            floatingCookBtn.classList.remove('visible', 'idle');
            floatingCookBtn.style.transform = 'translate3d(0, 0, 0)';
            clearTimeout(idleTimer);
          }
        }
      };

      window.addEventListener('scroll', () => {
        evaluateFloatingState();
        if (isFloatingVisible) resetIdleTimer();
      }, { passive: true });

      window.addEventListener('touchstart', resetIdleTimer, { passive: true });

      window.addEventListener('load', evaluateFloatingState);
      setTimeout(evaluateFloatingState, 300);
      setTimeout(evaluateFloatingState, 1000);
    }
  });
</script>
